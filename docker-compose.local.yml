name: medsocial2-local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-MedSocial2_Strong!Passw0rd}
    ports:
      - "${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongodb:
    image: mongo:7
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" || mongo --quiet --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./MedicSocial2_updated
      dockerfile: src/MedSocial2.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=${MSSQL_DATABASE:-MedSocial2Platform};User Id=sa;Password=${MSSQL_SA_PASSWORD:-MedSocial2_Strong!Passw0rd};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True;
      SocialMongo__ConnectionString: mongodb://mongodb:27017
      SocialMongo__DatabaseName: ${MONGODB_DATABASE:-MedSocial2Social}
      DocumentStorage__Local__BasePath: /app/Documents
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-MedSocial2-Docker-Signing-Key-Change-Me-At-Deployment}
      DefaultAdmin__Email: admin@medicsocial.local
      DefaultAdmin__Password: Admin@12345
      DefaultAdmin__ResetOnStartup: "true"
    ports:
      - "${API_PORT:-5241}:8080"
    volumes:
      - api-documents:/app/Documents
      - api-social-media:/app/wwwroot/social-media
    healthcheck:
      test: wget -qO- http://localhost:8080/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  client-next:
    build:
      context: ./client-next_updated
      dockerfile_inline: |
        FROM node:22-alpine AS deps
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci

        FROM node:22-alpine AS build
        WORKDIR /app
        ENV API_PROXY_TARGET=http://api:8080
        COPY --from=deps /app/node_modules ./node_modules
        COPY . ./
        RUN npm run build

        FROM node:22-alpine AS runner
        WORKDIR /app
        ENV NODE_ENV=production
        ENV PORT=3000
        ENV HOSTNAME=0.0.0.0
        COPY --from=build /app/.next/standalone ./
        COPY --from=build /app/.next/static ./.next/static
        COPY --from=build /app/public ./public
        COPY docker-entrypoint.sh /usr/local/bin/medsocial-entrypoint
        RUN chmod +x /usr/local/bin/medsocial-entrypoint
        EXPOSE 3000
        ENTRYPOINT ["/usr/local/bin/medsocial-entrypoint"]
        CMD ["node", "server.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PROXY_TARGET: http://api:8080
    ports:
      - "${CLIENT_PORT:-3000}:3000"

  admin-next:
    build:
      context: ./admin-next_updated
      dockerfile_inline: |
        FROM node:22-alpine AS deps
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci

        FROM node:22-alpine AS build
        WORKDIR /app
        ENV API_PROXY_TARGET=http://api:8080
        COPY --from=deps /app/node_modules ./node_modules
        COPY . ./
        RUN npm run build

        FROM node:22-alpine AS runner
        WORKDIR /app
        ENV NODE_ENV=production
        ENV PORT=3001
        ENV HOSTNAME=0.0.0.0
        COPY --from=build /app/.next/standalone ./
        COPY --from=build /app/.next/static ./.next/static
        COPY --from=build /app/public ./public
        COPY docker-entrypoint.sh /usr/local/bin/medsocial-entrypoint
        RUN chmod +x /usr/local/bin/medsocial-entrypoint
        EXPOSE 3001
        ENTRYPOINT ["/usr/local/bin/medsocial-entrypoint"]
        CMD ["node", "server.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PROXY_TARGET: http://api:8080
    ports:
      - "${ADMIN_PORT:-3001}:3001"

volumes:
  sqlserver-data:
  mongodb-data:
  api-documents:
  api-social-media:
