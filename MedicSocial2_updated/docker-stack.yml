services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - medsocial2-shared
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  mongodb:
    image: mongo:7
    volumes:
      - mongodb-data:/data/db
    networks:
      - medsocial2-shared
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" || mongo --quiet --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  api:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/${DOCKERHUB_NAMESPACE:-mvchr}/medsocial2-api:${IMAGE_TAG:-v2}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=${MSSQL_DATABASE:-MedSocial2Platform};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True;
      SocialMongo__ConnectionString: mongodb://mongodb:27017
      SocialMongo__DatabaseName: ${MONGODB_DATABASE:-MedSocial2Social}
      DocumentStorage__Local__BasePath: /app/Documents
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    volumes:
      - api-documents:/app/Documents
      - api-social-media:/app/wwwroot/social-media
    networks:
      - medsocial2-shared
    healthcheck:
      test: wget -qO- http://localhost:8080/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

  client-next:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/${DOCKERHUB_NAMESPACE:-mvchr}/medsocial2-client-next:${IMAGE_TAG:-v2}
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - medsocial2-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

  admin-next:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/${DOCKERHUB_NAMESPACE:-mvchr}/medsocial2-admin-next:${IMAGE_TAG:-v2}
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      - medsocial2-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

  admin-blazor:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/${DOCKERHUB_NAMESPACE:-mvchr}/medsocial2-admin-blazor:${IMAGE_TAG:-v2}
    networks:
      - medsocial2-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

  gateway:
    image: ${DOCKERHUB_REGISTRY:-docker.io}/${DOCKERHUB_NAMESPACE:-mvchr}/medsocial2-gateway:${IMAGE_TAG:-v2}
    ports:
      - target: 3000
        published: ${CLIENT_PORT:-3000}
        protocol: tcp
        mode: ingress
      - target: 3001
        published: ${ADMIN_PORT:-3001}
        protocol: tcp
        mode: ingress
      - target: 3002
        published: ${ADMIN_BLAZOR_PORT:-3002}
        protocol: tcp
        mode: ingress
    networks:
      - medsocial2-shared
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

volumes:
  sqlserver-data:
  mongodb-data:
  api-documents:
  api-social-media:

networks:
  medsocial2-shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-medsocial2-shared}
